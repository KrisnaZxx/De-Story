name: Rilis Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'De-Story-v*'

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Check frontend
        run: npm run typecheck

      - name: Stage Flow2API runtime for Windows
        env:
          FLOW2API_SOURCE: ${{ github.workspace }}/flow2api-src
        run: npm run flow2api:stage

      - name: Build Tauri app & installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Bara Studio v__VERSION__'
          releaseBody: 'Bara Studio v__VERSION__ untuk Windows x64 (.exe dan .msi). Pengaturan SSH lebih rapi. Render multi-VPS mengirim segmen langsung lewat HTTPS privat InstaBox dan menggabungkan video secara bertahap untuk mengurangi beban RAM.'
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc --bundles nsis,msi
